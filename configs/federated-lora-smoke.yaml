seed: 42
data:
  raw_path: dataset/alpaca_raw/alpaca_data.json
  task_groups_path: dataset/alpaca_task_groups.jsonl
  task_groups_manifest_path: dataset/alpaca_task_groups.manifest.json
  output_dir: dataset/alpaca_client_splits_smoke
  max_examples: 120
  dirichlet_alpha: 0.5
  min_samples_per_client: 8
model:
  name: Qwen/Qwen2.5-0.5B
  max_length: 256
  lora_rank: 8
  lora_alpha: 16
  lora_dropout: 0.05
  target_modules: [q_proj, v_proj]
training:
  local_steps: 2
  micro_batch_size: 1
  grad_accum: 1
  learning_rate: 0.0002
federation:
  mode: sync
  client_count: 3
  clients_per_round: 3
  rounds: 2
  total_updates: 6
  max_active: 3
  async_mix: 0.5
  duration_min: 1.0
  duration_max: 3.0
output_dir: exp/federated-lora-smoke
